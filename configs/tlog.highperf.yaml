log:
  level: info
  format: json
  async:
    enabled: true
    worker_multiplier: 2
    buffer_size: 1000000
    batch_size: 2000
    flush_interval: 10
  console:
    enabled: false
  file:
    enabled: true
    path: ./logs/app.log
    rotate:
      max_size: 500
      max_backups: 30
      max_age: 90
  stacktrace:
    enabled: true
    level: error
  sampling:
    enabled: true
    initial: 100000
    thereafter: 10000
  performance:
    lock_free: true
    use_pool: true
    prealloc: true
