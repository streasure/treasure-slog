log:
  level: debug
  format: json
  async:
    enabled: true
    worker_multiplier: 1
    buffer_size: 10000
    batch_size: 100
    flush_interval: 100
  console:
    enabled: true
    format: text
  file:
    enabled: true
    path: ./logs/app.log
    rotate:
      max_size: 10
      max_backups: 5
      max_age: 7
  stacktrace:
    enabled: true
    level: error
    depth: 10
  sampling:
    enabled: true
    initial: 100
    thereafter: 10
