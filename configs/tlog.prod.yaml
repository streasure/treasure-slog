log:
  level: info                    # 日志级别：debug < info < warn < error，生产用 info 过滤掉 debug 日志
  format: json                   # 输出格式：json（结构化，便于 ELK/Loki 等日志系统解析）或 text（人类可读）

  async:                         # 异步写入配置（核心性能参数）
    enabled: true                # 启用异步模式：日志先入环形缓冲区，由后台 worker 批量写入，不阻塞业务协程
    worker_multiplier: 1         # worker 数 = CPU核数 × 此倍数。1 = 核数个 worker，2 = 2倍核数（上限32；lock_free: true 时下限 4）
    buffer_size: 100000          # 环形缓冲区总容量（条，按 worker 分片均分）；缓冲满时降级为同步写入不丢日志，调大可让高峰期更久保持异步
    batch_size: 1000             # 每次批量写入的最大条数 + 刷盘字节阈值（KB，1000 ≈ 1MB），攒够或超时才刷盘，减少 I/O 次数
    flush_interval: 100          # 批量刷盘超时（毫秒），即使没攒够 batch_size 也在此时间后强制写入

  console:                       # 控制台输出
    enabled: false               # 生产关闭：避免 stdout 日志影响性能，且容器化部署通常由文件采集

  file:                          # 文件输出
    enabled: true                # 启用写日志文件
    path: ./logs/app.log         # 日志文件路径
    rotate:                      # 日志轮转（防磁盘爆满）
      max_size: 100              # 单文件最大 100MB，超过后切割新文件
      max_backups: 10            # 最多保留 10 个历史文件（超出删最旧的）
      max_age: 30                # 文件最长保留 30 天（超出删除）
      interval: 0                # 时间轮转间隔（秒），0=禁用；86400=每天切割

  stacktrace:                    # 堆栈追踪
    enabled: true                # 启用堆栈抓取
    level: error                 # 仅 error 级别日志附加堆栈（方便定位线上报错）
    depth: 10                    # 堆栈深度：向上取 10 层调用栈

  sampling:                      # 日志采样（高吞吐场景降噪，对齐 zap：按 (级别,消息) + 窗口限速）
    enabled: true                # 启用采样
    tick: 1                      # 采样窗口（秒）：每窗口重置，重新放行 initial 条
    initial: 10000               # 每窗口每种 (级别,消息) 前 10000 条全量记录（保证冷启动与突发不丢）
    thereafter: 1000             # 超过后该消息每 1000 条记录 1 条；不同消息计数独立（近似：4096 桶哈希冲突会合并）

  performance:                   # 底层性能优化开关
    lock_free: true              # 启用后确保最少 4 个 worker，分散环形缓冲区锁竞争（非真正无锁）
    use_pool: true               # 用 sync.Pool 复用 logEntry 对象，减少堆分配和 GC 压力
    prealloc: true               # 环形缓冲区容量翻倍预分配，避免运行时动态扩容的拷贝开销