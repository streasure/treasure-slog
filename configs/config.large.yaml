# 大日志场景专用配置文件
# 适用于每条日志大小超过1MB的场景
# 针对大日志进行了专门的优化配置

log:
  # 日志级别: debug, info, warn, error
  # 建议: 大日志场景下建议使用 info 或以上级别，减少日志量
  level: info
  
  # 日志格式: json, console
  # 建议: json 格式更适合大日志，便于解析和处理
  format: json
  
  # 异步配置
  # 针对大日志场景的优化配置
  async:
    # 是否启用异步日志
    # 建议: 大日志场景下必须启用，避免阻塞业务逻辑
    enabled: true
    
    # 环形缓冲区大小
    # 建议: 大日志场景下减小缓冲区大小，避免内存占用过高
    # 计算公式: buffer_size * 单条日志大小 ≈ 可接受的内存占用
    # 例如: 500 * 1MB = 500MB 内存占用
    buffer_size: 500
    
    # 批量写入大小
    # 建议: 大日志场景下减小批量大小，避免单次处理过大
    # 批量大小 * 单条日志大小 ≈ 单次处理的内存大小
    # 例如: 5 * 1MB = 5MB 单次处理
    batch_size: 5
    
    # 刷新间隔(毫秒)
    # 建议: 大日志场景下增加刷新间隔，减少 I/O 操作频率
    # 但也不要设置过长，避免内存占用过高
    flush_interval: 100
    
    # 工作线程数
    # 建议: 大日志场景下增加工作线程，提高并行处理能力
    # 推荐值: CPU 核心数的 2-4 倍
    workers: 16
  
  # 控制台输出配置
  # 建议: 大日志场景下禁用控制台输出，提高性能
  console:
    # 是否输出到控制台
    enabled: false
    # 控制台格式: json, text
    format: text
  
  # 文件输出配置
  # 针对大日志场景的优化配置
  file:
    # 是否输出到文件
    enabled: true
    # 日志文件路径
    path: ./logs/large.log
    # 轮转配置
    rotate:
      # 单个文件最大大小(MB)
      # 建议: 大日志场景下增加单个文件大小限制
      # 推荐值: 500-2000 MB
      max_size: 1000
      # 最大保留文件数
      # 建议: 大日志场景下减少备份文件数量，避免占用过多磁盘空间
      # 推荐值: 3-5 个
      max_backups: 3
      # 最大保留天数
      # 建议: 大日志场景下减少保留天数，避免占用过多磁盘空间
      # 推荐值: 7-14 天
      max_age: 7
      # 是否压缩旧文件
      # 建议: 大日志场景下禁用压缩，提高写入速度
      # 压缩大文件会占用大量 CPU 资源
      compress: false
  
  # 网络输出配置（支持 ELK、Graylog 等）
  # 针对大日志场景的优化配置
  network:
    # 是否启用网络输出
    # 建议: 大日志场景下谨慎启用，网络传输可能成为瓶颈
    enabled: false
    # 协议类型: tcp, udp, http
    type: tcp
    # 目标地址
    address: localhost:9200
    # 连接超时(秒)
    # 建议: 大日志场景下增加网络超时时间
    # 推荐值: 30-60 秒
    timeout: 30
    # 重试次数
    # 建议: 大日志场景下减少重试次数，避免长时间阻塞
    # 推荐值: 1-2 次
    retry: 1
    # 是否启用 TLS
    tls: false
  
  # 堆栈追踪配置
  # 针对大日志场景的优化配置
  stacktrace:
    # 是否启用堆栈追踪
    enabled: true
    # 追踪级别: error, warn
    level: error
    # 堆栈深度
    # 建议: 大日志场景下减少堆栈深度，避免堆栈信息过大
    # 推荐值: 5-10
    depth: 5
  
  # 日志采样配置
  # 针对大日志场景的优化配置
  sampling:
    # 是否启用采样
    # 建议: 大日志场景下启用采样，减少日志量
    enabled: true
    # 前 N 条全量记录
    # 推荐值: 100-1000
    initial: 100
    # 之后每 N 条记录 1 条
    # 推荐值: 10-100
    thereafter: 10
  
  # 字段缓存配置
  # 针对大日志场景的优化配置
  field_cache:
    # 是否启用字段缓存
    # 建议: 大日志场景下启用字段缓存，提高性能
    enabled: true
    # 缓存大小
    # 建议: 大日志场景下增加缓存大小，提高缓存命中率
    # 推荐值: 5000-10000
    size: 5000
  
  # 性能优化配置
  # 针对大日志场景的优化配置
  performance:
    # 是否启用无锁队列
    # 建议: 大日志场景下启用，提高并发性能
    lock_free: true
    # 是否启用对象池
    # 建议: 大日志场景下启用，减少内存分配
    use_pool: true
    # 是否启用内存预分配
    # 建议: 大日志场景下启用，减少运行时内存分配
    prealloc: true
