log:
  level: info
  format: json
  async:
    enabled: true
    buffer_size: 100000
    batch_size: 1000
    flush_interval: 100
    workers: 8
  console:
    enabled: false
  file:
    enabled: true
    path: ./logs/app.log
    rotate:
      max_size: 100
      max_backups: 10
      max_age: 30
      compress: true
  stacktrace:
    enabled: true
    level: error
  sampling:
    enabled: true
    initial: 10000
    thereafter: 1000
